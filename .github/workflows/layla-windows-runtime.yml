name: Layla Windows runtime

on:
  workflow_dispatch:
  push:
    branches: [layla-build]
    paths:
      - '.github/workflows/layla-windows-runtime.yml'
      - '.github/actions/windows-setup-cuda/**'
      - '.github/actions/windows-setup-rocm/**'
      - 'scripts/layla-windows-runtime.ps1'
      - 'scripts/install-oneapi.bat'
      - 'docs/layla-windows-runtime.md'
      - '**/CMakeLists.txt'
      - '**/*.cmake'
      - 'CMakePresets.json'
      - 'ggml/**'
      - 'src/**'
      - 'include/**'
      - 'common/**'
      - 'tools/server/**'
      - 'tools/mtmd/**'
      - 'tools/ui/CMakeLists.txt'
      - 'tools/ui/ui.cpp'
      - 'vendor/**'
      - 'licenses/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: layla-windows-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  CUDA12_VERSION: '12.4'
  CUDA13_VERSION: '13.4'
  CUDA_CCCL_VERSION: v3.4.3
  VULKAN_VERSION: 1.4.357.0
  ROCM_VERSION: '10.0.0'
  AMDGPU_TARGETS: gfx1010;gfx1011;gfx1012;gfx1030;gfx1031;gfx1032;gfx1033;gfx1034;gfx1035;gfx1036;gfx1100;gfx1101;gfx1102;gfx1103;gfx1150;gfx1151;gfx1152;gfx1153;gfx1200;gfx1201
  ONEAPI_ROOT: 'C:\Program Files (x86)\Intel\oneAPI'
  WINDOWS_DLE_URL: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/a51104eb-6f4a-4a0e-9dae-1b81b0c81ae1/intel-deep-learning-essentials-2026.1.4.16_offline.exe
  WINDOWS_ONEDNN_URL: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/34e28083-d04b-46a3-826c-8c1d00bf1e1c/intel-onednn-2026.0.2.47_offline.exe
  WINDOWS_DPCPP_MKL: intel.oneapi.win.cpp-dpcpp-common:intel.oneapi.win.mkl.devel:intel.oneapi.win.tbb.devel
  WINDOWS_DNNL: intel.oneapi.win.dnnl

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Windows x64 / ${{ matrix.backend }}
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, cuda12, cuda13, vulkan, rocm, sycl]
    steps:
      - uses: actions/checkout@v6

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Install CUDA
        if: startsWith(matrix.backend, 'cuda')
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ matrix.backend == 'cuda12' && env.CUDA12_VERSION || env.CUDA13_VERSION }}
          cuda_arch: x64

      - name: Install Vulkan SDK
        if: matrix.backend == 'vulkan'
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'VulkanSDK.exe'
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe" -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList '--accept-licenses --default-answer --confirm-command install' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Vulkan SDK installation failed: $($process.ExitCode)" }
          "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION" >> $env:GITHUB_ENV
          "C:\VulkanSDK\$env:VULKAN_VERSION\Bin" >> $env:GITHUB_PATH

      - name: Install ROCm
        if: matrix.backend == 'rocm'
        uses: ./.github/actions/windows-setup-rocm
        with:
          version: ${{ env.ROCM_VERSION }}

      - name: Initialize ROCm paths
        if: matrix.backend == 'rocm'
        run: |
          & C:\TheRock\build\.venv\Scripts\Activate.ps1
          $root = (rocm-sdk path --root).Trim()
          if ($LASTEXITCODE -ne 0 -or !$root) { throw 'ROCm root not found.' }
          $bin = (rocm-sdk path --bin).Trim()
          if ($LASTEXITCODE -ne 0 -or !$bin) { throw 'ROCm binaries not found.' }
          "HIP_PATH=$root" >> $env:GITHUB_ENV
          "HIP_BIN=$bin" >> $env:GITHUB_ENV
          "HIP_DEVICE_LIB_PATH=$root\lib\llvm\amdgcn\bitcode" >> $env:GITHUB_ENV
          'HIP_PLATFORM=amd' >> $env:GITHUB_ENV
          $bin >> $env:GITHUB_PATH

      - name: Install oneAPI
        if: matrix.backend == 'sycl'
        shell: cmd
        run: |
          call scripts\install-oneapi.bat %WINDOWS_DLE_URL% %WINDOWS_DPCPP_MKL%
          if errorlevel 1 exit /b %errorlevel%
          call scripts\install-oneapi.bat %WINDOWS_ONEDNN_URL% %WINDOWS_DNNL%
          if errorlevel 1 exit /b %errorlevel%

      - name: Install Level Zero SDK
        if: matrix.backend == 'sycl'
        run: |
          Invoke-WebRequest 'https://github.com/oneapi-src/level-zero/releases/download/v1.33.1/level-zero-win-sdk-1.33.1.zip' -OutFile "$env:RUNNER_TEMP/level-zero.zip"
          Expand-Archive "$env:RUNNER_TEMP/level-zero.zip" "$env:RUNNER_TEMP/level-zero" -Force
          "LEVEL_ZERO_V1_SDK_PATH=$env:RUNNER_TEMP/level-zero" >> $env:GITHUB_ENV

      - name: Build and stage runtime
        if: matrix.backend != 'sycl'
        run: ./scripts/layla-windows-runtime.ps1 -Backend '${{ matrix.backend }}'

      - name: Build and stage SYCL
        if: matrix.backend == 'sycl'
        shell: cmd
        run: |
          call "%ONEAPI_ROOT%\setvars.bat" intel64 --force
          if errorlevel 1 exit /b %errorlevel%
          pwsh -NoProfile -File scripts\layla-windows-runtime.ps1 -Backend sycl
          if errorlevel 1 exit /b %errorlevel%

      - name: Upload runtime component
        uses: actions/upload-artifact@v4
        with:
          name: layla-windows-x64-${{ matrix.backend }}
          path: build-windows/artifacts/${{ matrix.backend }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  package:
    name: Assemble downloadable runtime
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: layla-windows-x64-*
          path: build-windows/downloads
      - name: Verify and assemble matching components
        run: ./scripts/layla-windows-runtime.ps1 -Assemble
      - name: Probe CPU runtime
        run: |
          $runtime = (Resolve-Path build-windows/runtime).Path
          Remove-Item Env:GGML_BACKEND_PATH -ErrorAction SilentlyContinue
          Push-Location "$runtime/backends/cpu"
          try {
            & "$runtime/llama-server.exe" --list-devices
            if ($LASTEXITCODE -ne 0) { throw 'CPU runtime probe failed.' }
          } finally { Pop-Location }
      - name: Upload combined runtime
        uses: actions/upload-artifact@v4
        with:
          name: layla-windows-runtime-x64-${{ github.sha }}
          path: build-windows/runtime/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
